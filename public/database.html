<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>База партий — ChessOCR</title>
  <meta name="description" content="База оцифрованных шахматных партий. Поиск по имени, FIDE ID, турниру.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <a href="/" class="nav-logo">
        <span class="logo-icon">♚</span>
        <span class="logo-text">Chess<span class="logo-accent">OCR</span></span>
      </a>
      <div class="nav-links">
        <a href="/" class="nav-link" id="nav-upload">Загрузить</a>
        <a href="/database.html?v=2" class="nav-link active" id="nav-database">База партий</a>
      </div>
    </div>
  </nav>

  <main class="screen">
    <div class="container-wide">
      <div class="db-header">
        <div>
          <h1 class="screen-title">База партий</h1>
          <p class="screen-subtitle" id="db-count">Загрузка...</p>
        </div>
        <a href="/" class="btn btn--primary">+ Добавить партию</a>
      </div>

      <!-- Search & Filters -->
      <div class="search-bar">
        <input type="text" id="search-input" class="form-input" placeholder="Поиск по имени игрока...">
        <input type="text" id="filter-fide" class="form-input" placeholder="FIDE ID">
        <input type="text" id="filter-tournament" class="form-input" placeholder="Турнир">
        <button class="btn btn--secondary" id="btn-search">Найти</button>
        <button class="btn btn--ghost" id="btn-reset">Сбросить</button>
      </div>

      <!-- Games Table Header -->
      <div class="card">
        <div class="card-header">
          <h3 class="card-title">Партии</h3>
          <span class="badge" id="results-badge"></span>
        </div>
        <!-- Table header -->
        <div class="desktop-only-header" style="padding: 0 20px; border-bottom: 1px solid var(--border);">
          <div class="game-row" style="background: transparent; border: none; padding: 8px 0; font-size: 11px; font-weight: 700; letter-spacing: 0.05em; color: var(--text-muted); text-transform: uppercase;">
            <span>Белые vs Чёрные</span>
            <span>Турнир / Дата</span>
            <span>Результат</span>
            <span>Ошибки</span>
            <span></span>
          </div>
        </div>

        <!-- Games list -->
        <div id="games-list" style="padding: 8px 20px 20px;">
          <div class="db-empty">
            <div class="db-empty-icon">⏳</div>
            <p>Загрузка партий...</p>
          </div>
        </div>
      </div>

      <!-- Pagination -->
      <div class="pagination" id="pagination"></div>
    </div>
  </main>

  <!-- Game Detail Modal -->
  <div class="modal-overlay hidden" id="game-modal-overlay">
    <div class="modal" id="game-modal">
      <div class="modal-header">
        <h2 class="modal-title" id="modal-title">Партия</h2>
        <button class="btn btn--ghost btn--sm" id="modal-close">✕</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <style>
    .hover-gold:hover { color: var(--gold) !important; text-decoration: underline; }
    .game-row { cursor: pointer; }
    .game-row:hover { border-color: var(--gold) !important; }
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.7);
      z-index: 999; display: flex; align-items: center; justify-content: center;
      backdrop-filter: blur(4px);
    }
    .modal {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius-xl); max-width: 700px; width: 90%;
      max-height: 80vh; overflow-y: auto;
    }
    .modal-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 20px 24px; border-bottom: 1px solid var(--border);
      position: sticky; top: 0; background: var(--bg-card); z-index: 1;
    }
    .modal-title { font-size: 18px; }
    .modal-body { padding: 24px; }
    .pgn-modal { background: var(--bg-input); padding: 16px; border-radius: var(--radius); font-family: monospace; font-size: 13px; white-space: pre-wrap; word-break: break-all; color: var(--text-primary); max-height: 300px; overflow-y: auto; }
    .meta-details { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
    .meta-detail { display: flex; flex-direction: column; gap: 4px; }
    .meta-detail .label { font-size: 11px; color: var(--text-muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }
    .meta-detail .value { font-size: 14px; color: var(--text-primary); font-family: var(--font-mono); }
  </style>

  <script src="/js/pgn-exporter.js"></script>
  <script>
    const DB = (() => {
      let currentPage = 1;
      let currentFilters = {};

      async function loadGames(page = 1, filters = {}) {
        currentPage = page;
        currentFilters = filters;

        const params = new URLSearchParams({ page, limit: 20, ...filters });
        try {
          const res = await fetch('/api/games?' + params);
          const data = await res.json();
          renderGames(data.games || [], data.pagination);
        } catch (err) {
          document.getElementById('games-list').innerHTML = `
            <div class="db-empty">
              <div class="db-empty-icon">⚠</div>
              <p>Ошибка загрузки: ${err.message}</p>
            </div>`;
        }
      }

      function renderGames(games, pagination) {
        const list = document.getElementById('games-list');
        const countEl = document.getElementById('db-count');
        const badge = document.getElementById('results-badge');

        const total = pagination?.total || 0;
        if (countEl) countEl.textContent = `Всего партий в базе: ${total}`;
        if (badge) badge.textContent = `${total} результатов`;

        if (games.length === 0) {
          list.innerHTML = `<div class="db-empty"><div class="db-empty-icon">♟</div><p>Партии не найдены</p><p style="color: var(--text-muted); font-size: 13px; margin-top: 8px;">Загрузите первый скан на главной странице</p></div>`;
          return;
        }

        list.innerHTML = games.map(g => `
          <div class="game-row fade-in" onclick="DB.openGame('${g.id}')">
            <div class="game-players">
              <div>♔ <a href="/player.html?id=${g.white_fide_id}" onclick="event.stopPropagation()" style="color: inherit;" class="hover-gold">${g.white_name || g.white_fide_id}</a></div>
              <div style="color: var(--text-secondary); font-size: 13px;">FIDE: ${g.white_fide_id}</div>
              <div style="margin-top: 4px;">♚ <a href="/player.html?id=${g.black_fide_id}" onclick="event.stopPropagation()" style="color: inherit;" class="hover-gold">${g.black_name || g.black_fide_id}</a></div>
              <div style="color: var(--text-secondary); font-size: 13px;">FIDE: ${g.black_fide_id}</div>
            </div>
            <div class="game-meta">
              <div>${g.tournament || '—'}</div>
              <div style="color: var(--text-muted);">Тур ${g.round || '?'} · ${g.game_date ? new Date(g.game_date).toLocaleDateString('ru-RU') : '—'}</div>
              <div style="color: var(--text-muted);">${g.location || ''}</div>
            </div>
            <div class="game-result">${g.result || '*'}</div>
            <div class="game-errors">
              ${g.has_errors ? '<span class="badge badge--error">⚠</span>' : ''}
              <span class="badge" style="background: var(--bg-input); color: var(--gold);">${g.source || 'ocr'}</span>
            </div>
            <div>
              <button class="btn btn--ghost btn--xs" onclick="event.stopPropagation(); DB.openGame('${g.id}')">Открыть</button>
            </div>
          </div>
        `).join('');

        renderPagination(pagination);
      }

      function renderPagination(p) {
        const el = document.getElementById('pagination');
        if (!p || p.pages <= 1) { el.innerHTML = ''; return; }
        let html = '';
        for (let i = 1; i <= p.pages; i++) {
          html += `<button class="btn ${i === p.page ? 'btn--secondary' : 'btn--ghost'} btn--sm" onclick="DB.loadGames(${i})">${i}</button>`;
        }
        el.innerHTML = html;
      }

      async function openGame(id) {
        const overlay = document.getElementById('game-modal-overlay');
        const body = document.getElementById('modal-body');
        const title = document.getElementById('modal-title');
        overlay.classList.remove('hidden');
        body.innerHTML = '<p style="color: var(--text-muted)">Загрузка...</p>';

        try {
          const res = await fetch('/api/games/' + id);
          const g = await res.json();

          title.textContent = `${g.white_name || '?'} vs ${g.black_name || '?'}`;
          body.innerHTML = `
            <div class="meta-details">
              <div class="meta-detail"><span class="label">Белые</span><span class="value">${g.white_name || '—'} (${g.white_fide_id})</span></div>
              <div class="meta-detail"><span class="label">Чёрные</span><span class="value">${g.black_name || '—'} (${g.black_fide_id})</span></div>
              <div class="meta-detail"><span class="label">Турнир</span><span class="value">${g.tournament || '—'}</span></div>
              <div class="meta-detail"><span class="label">Дата</span><span class="value">${g.game_date ? new Date(g.game_date).toLocaleDateString('ru-RU') : '—'}</span></div>
              <div class="meta-detail"><span class="label">Тур / Стол</span><span class="value">${g.round || '?'} / ${g.board_number || '?'}</span></div>
              <div class="meta-detail"><span class="label">Результат</span><span class="value" style="color: var(--gold); font-size: 18px;">${g.result || '*'}</span></div>
              <div class="meta-detail"><span class="label">Локация</span><span class="value">${g.location || '—'}</span></div>
              <div class="meta-detail"><span class="label">Источник</span><span class="value" style="color: var(--gold); text-transform: uppercase;">${g.source || 'ocr'}</span></div>
              <div class="meta-detail"><span class="label">Добавлено</span><span class="value">${new Date(g.created_at).toLocaleString('ru-RU')}</span></div>
            </div>
            <div style="margin-bottom: 12px; display: flex; gap: 8px;">
              <a href="/index.html?edit=${g.id}" class="btn btn--primary btn--sm">Редактировать</a>
              <button class="btn btn--secondary btn--sm" onclick="navigator.clipboard.writeText(document.getElementById('pgn-modal-text').textContent)">Копировать PGN</button>
              <button class="btn btn--ghost btn--sm" onclick="PGNExporter.importToLichess(document.getElementById('pgn-modal-text').textContent)">Открыть в Lichess ↗</button>
            </div>
            <div class="pgn-modal" id="pgn-modal-text">${escapeHtml(g.pgn)}</div>
            ${g.has_errors ? '<p style="color: var(--warning); font-size: 13px; margin-top: 12px;">⚠ Партия содержит нераспознанные или нелегальные ходы</p>' : ''}
          `;
        } catch (err) {
          body.innerHTML = `<p style="color: var(--error)">Ошибка: ${err.message}</p>`;
        }
      }

      function escapeHtml(str) {
        return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      }

      function init() {
        loadGames();

        document.getElementById('btn-search')?.addEventListener('click', () => {
          const filters = {};
          const search = document.getElementById('search-input')?.value?.trim();
          const fide = document.getElementById('filter-fide')?.value?.trim();
          const tourn = document.getElementById('filter-tournament')?.value?.trim();
          if (search) filters.search = search;
          if (fide) filters.fide_id = fide;
          if (tourn) filters.tournament = tourn;
          loadGames(1, filters);
        });

        document.getElementById('btn-reset')?.addEventListener('click', () => {
          ['search-input', 'filter-fide', 'filter-tournament'].forEach(id => {
            const el = document.getElementById(id);
            if (el) el.value = '';
          });
          loadGames(1, {});
        });

        document.getElementById('search-input')?.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') document.getElementById('btn-search')?.click();
        });

        document.getElementById('modal-close')?.addEventListener('click', () => {
          document.getElementById('game-modal-overlay').classList.add('hidden');
        });
        document.getElementById('game-modal-overlay')?.addEventListener('click', (e) => {
          if (e.target === e.currentTarget) e.currentTarget.classList.add('hidden');
        });
      }

      return { init, loadGames, openGame };
    })();

    document.addEventListener('DOMContentLoaded', () => DB.init());
  </script>
</body>
</html>
